# Builds a release whenever a version tag is pushed:
#
#   git tag v0.4.1 && git push origin v0.4.1
#
# On Windows, because the app is a Windows app: the agent is Win32 through and
# through, and the checks should run where it runs. The zip is also uploaded as
# a workflow artifact, so a run started by hand (Actions → Release → Run
# workflow) produces a download without publishing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Typecheck
        run: npm run typecheck

      # The suites with no network and no hardware in them. The voice and Win32
      # checks need a microphone and a desktop, which a runner does not have.
      - name: Checks
        run: |
          npm run smoke -w @everything/server
          npm run manga-check -w @everything/server
          npm run notes-check -w @everything/server
          npm run integrations-check -w @everything/server
          npm run modules-check -w @everything/server
          npm run vault-check -w @everything/server
          npm run import-check -w @everything/server
          npm run voice-check -w @everything/server
          npm run weather-check -w @everything/server
          npm run publish-check

      - name: Build the app
        run: npm run build -w @everything/web

      # The app's own Node, into runtime/node, the same script a git clone runs
      # on first start, so the zip carries it and needs nothing installed.
      - name: Bundle Node.js
        shell: powershell
        run: . ./scripts/node-runtime.ps1

      - name: Package
        run: node scripts/package-release.mjs --bundle

      # The reader on its own: manga and push, nothing else in the folder.
      - name: Package Just Manga
        run: node scripts/package-release.mjs --bundle --config just-manga

      # The desktop client: the agent alone, for a PC that does not run the
      # server. A second download beside the full app; see package-desktop.mjs.
      - name: Package the desktop client
        run: node scripts/package-desktop.mjs

      - name: Keep as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: blue-everything
          path: dist/release/*.zip

      # The version's own section of CHANGELOG.md becomes the release notes.
      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ---

          **Two downloads.** `Blue-Everything-*.zip` is everything. `BlueEverything-JustManga-*.zip` is the manga reader on its own; it updates as Just Manga and never downloads the rest. `update.ps1 -Configuration everything` switches later.

          **Installing:** unzip the folder anywhere (Windows 10 or 11, 64-bit) and double-click `Blue Everything.cmd`. Nothing else needs installing: Node.js is inside. For manga, open Manga and press **Set up manga**.

          **Updating:** double-click `Update Blue Everything.cmd`, or Settings → Packages → Check for updates. Your data is backed up to `backups\` first and is never replaced.

          **Blue Everything Desktop** (`BlueEverything-Desktop-*.zip`) is for a Windows PC whose Blue Everything runs somewhere else: a friend's copy on your PC, or your second PC. It adds the tray icon, popups above games, noticing when a match ends, and voice. Unzip it, double-click `Blue Everything Desktop.cmd`, and type the address and code from Settings → Devices → Sign in another device.
          EOF
          sha256sum dist/release/*.zip | sed 's#dist/release/##' > dist/release/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" dist/release/*.zip dist/release/SHA256SUMS.txt \
            --title "Blue Everything $version" --notes-file notes.md
