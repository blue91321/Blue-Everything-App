<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the layout can reach under the iPhone's notch and
         home indicator; styles.css pads it back with safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14161c" />
    <title>Blue Everything</title>

    <!-- Tells iOS to launch from the home screen without Safari's chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blue Everything" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Stamp the last known look before anything renders.

      The real setting comes from the server, which is a round trip away — long
      enough to paint the default first. On a dark-themed app that shows as a
      white flash on every cold load, which is the single most noticeable thing
      a theme can get wrong.

      Inline and blocking on purpose: a deferred module would run after first
      paint and defeat the point. It is a dozen lines and reads only from
      localStorage, which `theme.ts` writes from server responses.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('everything:theme') || 'dark';
          var accent = localStorage.getItem('everything:accent') || 'blue';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.accent = accent;
        } catch (e) {
          // Storage blocked. The stylesheet's own defaults are dark + blue, so
          // doing nothing here lands on exactly the right place anyway.
        }
      })();
    </script>

    <!--
      A page older than the build reloads instead of staying white.

      The app's own script and stylesheet are named by a hash that changes with
      every build. A copy of this page from before a rebuild asks for names the
      server no longer has, the script never runs, and the window stays white
      with nothing on it. `stale-build.ts` covers the screens loaded later, but
      it is inside that script, so it cannot cover the script itself: this has
      to be here, before it. Once a minute at most (the same record
      `stale-build.ts` keeps), so a build that is really missing a file stops
      rather than reloading forever, and not while offline.
    -->
    <script>
      window.addEventListener(
        'error',
        function (event) {
          var el = event.target;
          var url = el && (el.src || el.href);
          if (!url || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK') || url.indexOf('/assets/') === -1) return;
          if (navigator.onLine === false) return;
          try {
            var last = Number(sessionStorage.getItem('everything-stale-reload')) || 0;
            if (Date.now() - last < 60000) return;
            sessionStorage.setItem('everything-stale-reload', String(Date.now()));
          } catch (e) {
            return;
          }
          location.reload();
        },
        true
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
